# Continuous Deployment for the Flutter web build.
#
# Builds the web app and rsyncs it to the server directory that the backend
# stack's nginx serves (the `./webapp` volume in docker-compose.production.yml).
# Backend and web live on the same host, so this mirrors the backend's deploy.
#
# Pull requests are validated by the separate `ci` workflow. This workflow only
# builds the already-validated main branch and deploys it. Set the repository
# variable WEB_DEPLOY_ENABLED=true after configuring all four secrets; until
# then GitHub skips the job before allocating a runner.
#
# Required repository secrets (same values as the backend repo's deploy):
#   DEPLOY_HOST     server hostname / IP
#   DEPLOY_USER     ssh user
#   DEPLOY_SSH_KEY  private key (PEM) for that user
#   DEPLOY_PATH     absolute path on the server that contains ./webapp
#                   (e.g. /opt/gymboss)

name: deploy-web

on:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    if: vars.WEB_DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Deploy to server (rsync over SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            build/web/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/webapp/"
