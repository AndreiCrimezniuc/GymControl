# Continuous Deployment for the Flutter web build.
#
# Builds the web app and rsyncs it to the server directory that the backend
# stack's nginx serves (the `./webapp` volume in docker-compose.production.yml).
# Backend and web live on the same host, so this mirrors the backend's deploy.
#
# Self-contained (analyze + build gate, then deploy) so it doesn't depend on the
# separate `ci` workflow. Runs on push to main and can be triggered manually.
#
# Required repository secrets (same values as the backend repo's deploy):
#   DEPLOY_HOST     server hostname / IP
#   DEPLOY_USER     ssh user
#   DEPLOY_SSH_KEY  private key (PEM) for that user
#   DEPLOY_PATH     absolute path on the server that contains ./webapp
#                   (e.g. /opt/gymboss)

name: deploy-web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Check deploy credentials
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy secrets are not configured; release was verified but not uploaded"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server (rsync over SSH)
        if: steps.deploy.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            build/web/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/webapp/"
