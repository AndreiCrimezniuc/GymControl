name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: Analyze · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Legacy screens are being migrated incrementally. Enforce formatting
        # on files changed by the PR so unrelated debt cannot block releases.
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.dart')
          if [ "${#files[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build APK (debug)
        run: flutter build apk --debug

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
