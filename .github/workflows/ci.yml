name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: Analyze · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # NOTE: the `dart format --set-exit-if-changed` gate was removed — the
      # codebase predates Dart 3.7's "tall style" formatter, so it flagged the
      # whole repo. Re-introduce it after a dedicated repo-wide `dart format`.

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build APK (debug)
        run: flutter build apk --debug
